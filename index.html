<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AetherVault — Cloud Sync</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col p-4 sm:p-6">
  
  <header class="flex justify-between items-center pb-4 border-b border-zinc-800 mb-6">
    <div>
      <h1 class="text-base sm:text-lg font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">Class Media Vault</h1>
      <p id="syncStatus" class="text-xs text-zinc-400">Connecting to cloud...</p>
    </div>
    <label class="cursor-pointer bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-2 rounded-lg text-xs sm:text-sm font-medium transition shadow-lg shadow-indigo-600/20">
      Upload Photo/Video
      <input id="fileInput" type="file" accept="image/*,video/*" multiple class="hidden" />
    </label>
  </header>

  <main class="flex-1 flex flex-col">
    <div id="mediaGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"></div>
  </main>

  <script>
    // PASTE YOUR JSONBIN DETAILS HERE:
    const BIN_ID = "YOUR_BIN_ID_HERE";
    const API_KEY = "YOUR_MASTER_KEY_HERE";
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    async function fetchCloudData() {
      if (BIN_ID.includes("YOUR_BIN")) {
        document.getElementById('syncStatus').textContent = "Please configure your JSONBin ID in the code.";
        return;
      }
      try {
        const res = await fetch(API_URL, {
          headers: { 'X-Master-Key': API_KEY }
        });
        const data = await res.json();
        renderGrid(data.record.items || []);
        document.getElementById('syncStatus').textContent = "Synced with Cloud";
      } catch (err) {
        document.getElementById('syncStatus').textContent = "Sync failed. Check connection.";
      }
    }

    async function saveCloudData(items) {
      try {
        await fetch(API_URL, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': API_KEY
          },
          body: JSON.stringify({ items })
        });
      } catch (err) {
        alert("Failed to save to cloud.");
      }
    }

    function renderGrid(items) {
      const grid = document.getElementById('mediaGrid');
      grid.innerHTML = '';
      if (!items.length) {
        grid.innerHTML = `<div class="col-span-full py-16 text-center text-xs text-zinc-500">No media uploaded yet.</div>`;
        return;
      }
      items.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden shadow-md";
        const preview = item.type === 'video'
          ? `<video src="${item.url}" class="w-full h-36 object-cover bg-black" controls></video>`
          : `<img src="${item.url}" class="w-full h-36 object-cover bg-zinc-950" loading="lazy" />`;
        card.innerHTML = `
          ${preview}
          <div class="p-2.5">
            <p class="text-xs font-medium truncate text-zinc-200">${item.title}</p>
            <p class="text-[10px] text-zinc-500 mt-0.5">By ${item.uploader || 'Classmate'}</p>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    document.getElementById('fileInput').onchange = async (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;
      document.getElementById('syncStatus').textContent = `Uploading ${files.length} file(s)...`;

      // Fetch current items first
      const res = await fetch(API_URL, { headers: { 'X-Master-Key': API_KEY } });
      const data = await res.json();
      let items = data.record.items || [];

      for (const file of files) {
        const reader = new FileReader();
        await new Promise((resolve) => {
          reader.onload = async () => {
            const newItem = {
              id: 'item_' + Date.now() + Math.random(),
              title: file.name.replace(/\.[^/.]+$/, ''),
              type: file.type.startsWith('video/') ? 'video' : 'image',
              url: reader.result, // base64 storage
              uploader: 'Classmate',
              createdAt: Date.now()
            };
            items.unshift(newItem);
            resolve();
          };
          reader.readAsDataURL(file);
        });
      }

      await saveCloudData(items);
      renderGrid(items);
      document.getElementById('syncStatus').textContent = "Upload complete & synced!";
      e.target.value = '';
    };

    fetchCloudData();
    setInterval(fetchCloudData, 15000); // Auto-refresh every 15 seconds
  </script>
</body>
</html>
